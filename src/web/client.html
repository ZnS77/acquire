<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>并购风云 · 玩家端（联机）</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>并购风云 <span class="tag">玩家端</span></h1>
      <div class="setup">
        <span id="conn" style="font-size:13px;color:var(--muted)">连接中…</span>
        <label>房间 <input id="room" style="width:90px" value="demo" /></label>
        <label>我是
          <select id="me">
            <option value="p1">玩家 1</option>
            <option value="p2">玩家 2</option>
            <option value="p3">玩家 3</option>
            <option value="p4">玩家 4</option>
            <option value="p5">玩家 5</option>
            <option value="p6">玩家 6</option>
          </select>
        </label>
        <button id="connect">进入房间</button>
      </div>
    </header>

    <main class="layout">
      <section class="board-col">
        <div id="status" class="status"></div>
        <div id="board" class="board"></div>
        <div id="hand" class="hand"></div>
        <div id="actions" class="actions"></div>
      </section>
      <aside class="side-col">
        <div id="market" class="panel"></div>
        <div id="players" class="panel"></div>
        <div id="log" class="panel log"></div>
      </aside>
    </main>

    <script type="module" src="./client.ts"></script>
  </body>
</html>
